                  type: string
                  example: Soft and comfortable everyday t-shirt
                short_description:
                  type: string
                  example: 100% cotton, available in multiple colors and sizes
                price:
                  type: number
                  example: '29.99'
                compare_price:
                  type: number
                  example: '39.99'
                cost_price:
                  type: integer
                  example: '12'
                stock:
                  type: integer
                  example: '200'
                low_stock_threshold:
                  type: integer
                  example: '5'
                manage_stock:
                  type: integer
                  example: '1'
                sku:
                  type: string
                  example: DS456568
                product_image[0]:
                  type: string
                  format: binary
                product_image[1]:
                  type: string
                  format: binary
                tags[]:
                  type: integer
                  example: '2'
                weight:
                  type: number
                  example: '0.5'
                is_active:
                  type: integer
                  example: '1'
                is_featured:
                  type: integer
                  example: '0'
