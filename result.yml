    backgroundColor: '#FFFFFF'
    altText: logo
  termsOfService: '#'
  contact:
    name: Mero Vision
    url: https://merovision.com
    email: merovision720@gmail.com
  license:
    name: MIT
    url: https://es.wikipedia.org/wiki/Licencia_MIT
servers:
  - url: https://api.chandramarket.com/
    description: server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
tags:
  - name: Admin
  - name: Admin > Auth
  - name: Admin > Admin
  - name: Admin > Category
  - name: Admin > Brand
  - name: Admin > Tags
  - name: Admin > Products
  - name: Admin > Site Settings
  - name: Admin > FAQ
  - name: Admin > Contact Us
  - name: Admin > News Letter
  - name: Admin > Banner
  - name: Admin > Coupen
  - name: Admin > State
  - name: Admin > Shipping City
  - name: Admin > Dashboard
  - name: Admin > Order
  - name: Admin > DB Backup
  - name: Admin > Settings
  - name: Customer
  - name: Customer > Site Settings
  - name: Customer > Category
  - name: Customer > Brand
  - name: Customer > Products
  - name: Customer > Order
  - name: Customer > Contact Us
  - name: Customer > News Letter
  - name: Customer > Faq
  - name: Customer > Settings
  - name: Customer > Shipping Rate
paths:
  /api/admin/login:
    post:
      tags:
        - Admin > Auth
      summary: login
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: info@chandramart.com
                password:
                  type: string
                  example: Password
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/admin/forget-password:
    post:
      tags:
        - Admin > Auth
      summary: forget password
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: nitesh0hamal@gmail.com
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
