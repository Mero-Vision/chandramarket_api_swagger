                  type: integer
                  example: '5'
                manage_stock:
                  type: integer
                  example: '1'
                sku:
                  type: string
                  example: DS456568
                product_image[0]:
                  type: string
                  format: binary
                product_image[1]:
                  type: string
                  format: binary
                tags[]:
                  type: integer
                  example: '2'
                weight:
                  type: number
                  example: '0.5'
                is_active:
                  type: integer
                  example: '1'
                is_featured:
                  type: integer
                  example: '0'
